name: Build

# Compila MinIO (server + mc) dal sorgente upstream con le patch di patches/ e pubblica
# ghcr.io/jarvit/minio. Su ogni PR e su main esegue i test delle patch (stage `test` del
# Dockerfile) e compila l'immagine; su main e a mano la pubblica, se il tag non esiste
# gia', e allega all'immagine il documento OpenVEX firmato (cosign keyless, identita'
# OIDC di questo workflow).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'vex/minio.openvex.json'
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  # Devono coincidere con MINIO_RELEASE e IMAGE_TAG nel Dockerfile.
  MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
  IMAGE_TAG: RELEASE.2025-10-15T17-29-55Z-jarvit.1
  IMAGE: ghcr.io/${{ github.repository_owner }}/minio

jobs:
  build:
    name: Build MinIO image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag del Dockerfile allineato al workflow
        run: |
          grep -q "^ARG MINIO_RELEASE=${MINIO_RELEASE}$" Dockerfile
          grep -q "^ARG IMAGE_TAG=${IMAGE_TAG}$" Dockerfile
          case "$IMAGE_TAG" in "${MINIO_RELEASE}"-jarvit.*) ;; *) echo "IMAGE_TAG non deriva da MINIO_RELEASE" >&2; exit 1 ;; esac

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test delle patch
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Un tag pubblicato non si sovrascrive: chi lo pinna per digest deve ritrovare la
      # stessa immagine. Una nuova revisione delle patch alza IMAGE_TAG (-jarvit.N).
      - name: Tag gia' pubblicato
        id: published
        if: github.event_name != 'pull_request'
        run: |
          if docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:$IMAGE_TAG esiste gia': nessuna pubblicazione"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (e push fuori dalle PR)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.published.outputs.exists == 'false' }}
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Il VEX si allega anche quando il tag esiste gia': un run fallito a meta' (per
      # esempio un errore transitorio del registro di trasparenza) si completa
      # rieseguendo il workflow, senza ricostruire ne' sovrascrivere l'immagine.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: VEX firmato
        if: github.event_name != 'pull_request'
        env:
          PUSHED_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTS: ${{ steps.published.outputs.exists }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          set -eu
          if [ "$EXISTS" = "true" ]; then
            INDEX_DIGEST=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{json .Manifest}}' | jq -r .digest)
          else
            INDEX_DIGEST=$PUSHED_DIGEST
          fi
          platforms=$(docker buildx imagetools inspect --raw "$IMAGE@$INDEX_DIGEST" \
            | jq -r '.manifests[] | select(.platform.os == "linux") | .digest')
          # Trivy identifica un'immagine locale col digest della configurazione: anche
          # questi entrano fra i prodotti del VEX.
          configs=$(for d in $platforms; do
            docker buildx imagetools inspect --raw "$IMAGE@$d" | jq -r .config.digest
          done)
          vex/render.sh "$IMAGE_TAG" "$INDEX_DIGEST" $platforms $configs > minio.openvex.json
          verify() {
            cosign verify-attestation --type openvex --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$1" > /dev/null 2>&1
          }
          for d in "$INDEX_DIGEST" $platforms; do
            if verify "$d"; then
              echo "$IMAGE@$d: VEX gia' allegato e verificato"
              continue
            fi
            for attempt in 1 2 3; do
              cosign attest --yes --type openvex --predicate minio.openvex.json "$IMAGE@$d" && break
              [ "$attempt" = 3 ] && exit 1
              sleep 10
            done
            verify "$d"
            echo "$IMAGE@$d: VEX allegato e verificato"
          done
          {
            echo "### $IMAGE:$IMAGE_TAG"
            echo
            echo "Indice: \`$INDEX_DIGEST\`"
            for d in $platforms; do echo "- piattaforma: \`$d\`"; done
            for d in $configs; do echo "- configurazione: \`$d\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Documento VEX
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: minio.openvex.json
          path: minio.openvex.json
